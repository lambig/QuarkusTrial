quarkus.http.host=0.0.0.0
quarkus.log.console.level=DEBUG
quarkus.thread-pool.max-threads=24

quarkus.vertx.prefer-native-transport=true

quarkus.native.native-image-xmx=4g
quarkus.native.enable-isolates=true
quarkus.native.enable-http-url-handler=false
quarkus.native.enable-https-url-handler=false
quarkus.native.auto-service-loader-registration=false
quarkus.native.full-stack-traces=false
quarkus.native.add-all-charsets=false

quarkus.native.additional-build-args=\
    -H:+UnlockExperimentalVMOptions,\
    --no-fallback,\
    -R:MaxHeapSize=64m,\
    -R:MinHeapSize=64m,\
    -march=native,\
    --initialize-at-build-time,\
    -H:+InlineBeforeAnalysis

quarkus.native.container-runtime-options=--env,JAVA_OPTS=-Xmx64m -Xms64m