name: Gradle CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: corretto
          java-version: '21'
      - name: Build and test
        run: |
          bash ./gradlew --no-daemon --console=plain -Dorg.gradle.jvmargs=-Xmx512m clean build
      - name: Preserve test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.run_attempt }}
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/**
          if-no-files-found: error
          retention-days: 14
      - name: Build Java 21 runtime and development images
        run: |
          docker build -f src/main/docker/Dockerfile.jvm -t quarkus-ci .
          docker run -d --name quarkus-ci -p 127.0.0.1:8080:8080 quarkus-ci
          curl --fail --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 3 --retry-max-time 90 http://127.0.0.1:8080/hello || { docker logs quarkus-ci; exit 1; }
          docker rm -f quarkus-ci
          bash ./gradlew --no-daemon --console=plain '-Dquarkus.package.jar.type=legacy-jar' quarkusBuild
          docker build -f src/main/docker/Dockerfile.legacy-jar -t quarkus-legacy-ci .
          docker run -d --name quarkus-legacy-ci -p 127.0.0.1:8080:8080 quarkus-legacy-ci
          curl --fail --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 3 --retry-max-time 90 http://127.0.0.1:8080/hello || { docker logs quarkus-legacy-ci; exit 1; }
          docker rm -f quarkus-legacy-ci
          docker build -f .devcontainer/Dockerfile -t quarkus-dev-ci .devcontainer
          docker run --rm quarkus-dev-ci java -version
          docker run --rm quarkus-dev-ci pebble help
